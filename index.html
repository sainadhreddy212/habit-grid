<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F3F7FB">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Habit Grid">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Habit Grid</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500..800&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  color-scheme:light;
  --bg:#F3F7FB; --surface:#FFFFFF; --surface-2:#EEF2F9; --ink:#16202E; --muted:#5F6B7C; --line:#DDE5EF;
  --accent:#0E9F8E; --accent-ink:#FFFFFF; --accent-soft:#D8F3EF; --danger:#E11D48; --danger-soft:#FFE4EA;
  --a1:#14B8A6; --a2:#3B82F6; --a3:#7C5CFC; --a4:#EC4899; --a5:#F59E0B;
  --grad:linear-gradient(135deg,#14B8A6 0%,#3B82F6 55%,#7C5CFC 100%);
  --w1:#B39AF0; --w2:#8DB2F4; --w3:#F09BB9; --w4:#82D69D; --w5:#F5AE7F;
  --shadow:0 2px 4px rgba(45,60,110,.05),0 10px 24px rgba(45,60,110,.08);
  --display:'Bricolage Grotesque','DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --body:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-text-size-adjust:100%}
body{padding-inline:16px;padding-block:0;min-height:100%}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:720px;margin-inline:auto}
.num{font-variant-numeric:tabular-nums}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.01em;text-wrap:balance}
.eyebrow{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600}

/* header */
.top{display:flex;align-items:center;justify-content:space-between;padding-block:14px 6px;gap:12px}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.logo{width:30px;height:30px;border-radius:9px;background:var(--accent);display:grid;grid-template-columns:repeat(3,1fr);gap:2px;padding:6px}
.logo i{background:var(--accent-ink);border-radius:1.5px;opacity:.95}
.logo i:nth-child(2),.logo i:nth-child(6),.logo i:nth-child(7){opacity:.35}
.brand b{font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:-.02em}
.brand span{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:var(--surface);box-shadow:var(--shadow);color:var(--muted)}

/* month nav */
.mnav{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-block:8px 10px}
.mnav h2{font-size:22px;font-weight:700}
.mnav .grp{display:flex;gap:6px;align-items:center}
.pill{height:34px;min-width:34px;padding-inline:12px;border-radius:999px;background:var(--surface);box-shadow:var(--shadow);font-weight:600;font-size:13px;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.pill.accent{background:var(--accent);color:var(--accent-ink)}

/* day strip */
.strip{position:relative;display:flex;gap:6px;overflow-x:auto;padding-block:4px 10px;margin-inline:-16px;padding-inline:16px;scrollbar-width:none;scroll-snap-type:x proximity}
.strip::-webkit-scrollbar{display:none}
.chip{flex:0 0 auto;width:46px;height:66px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:space-between;padding:8px 0 8px;scroll-snap-align:center;position:relative}
.chip .dw{font-size:10px;font-weight:600;color:var(--muted);letter-spacing:.04em}
.chip .dn{font-family:var(--display);font-size:18px;font-weight:700;line-height:1}
.chip .bar{width:26px;height:4px;border-radius:2px;background:var(--surface-2);overflow:hidden}
.chip .bar i{display:block;height:100%;background:var(--wc,var(--accent))}
.chip.today{box-shadow:inset 0 0 0 2px var(--accent),var(--shadow)}
.chip.sel{background:var(--ink);color:var(--bg)}
.chip.sel .dw{color:var(--bg);opacity:.7}
.chip.sel .bar{background:rgba(128,128,128,.4)}
.chip.future{opacity:.5}

/* cards */
.card{background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:16px}
.card + .card{margin-top:12px}
.sum{display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.sum h3{font-size:24px;font-weight:700}
.sum .big{font-family:var(--display);font-size:38px;font-weight:700;line-height:1}
.sum .big small{font-size:16px;color:var(--muted);font-weight:600}
.meter{height:8px;border-radius:4px;background:var(--surface-2);overflow:hidden;margin-top:12px}
.meter i{display:block;height:100%;background:var(--accent);border-radius:4px;transition:width .25s ease}

/* habit rows */
.hlist{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.hrow{display:flex;align-items:center;gap:14px;width:100%;text-align:left;background:var(--surface);border-radius:18px;padding:12px 14px;min-height:60px;box-shadow:var(--shadow)}
.hrow[disabled]{opacity:.5;cursor:not-allowed}
.box{flex:0 0 auto;width:30px;height:30px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;color:transparent;transition:background .15s,border-color .15s}
.box svg{width:18px;height:18px}
.hrow[aria-pressed="true"] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.hrow[aria-pressed="true"] .hname{color:var(--muted);text-decoration:line-through;text-decoration-thickness:1px}
.hname{flex:1;font-weight:600;font-size:16px;min-width:0;overflow-wrap:anywhere}
.hmeta{flex:0 0 auto;text-align:right;font-size:12px;color:var(--muted);line-height:1.3}
.hmeta b{display:block;color:var(--ink);font-size:13px}
.streak{display:inline-block;background:var(--accent-soft);color:var(--accent);padding:1px 8px;border-radius:99px;font-size:11px;font-weight:700;margin-top:2px}

.note{background:var(--accent-soft);color:var(--ink);border-radius:16px;padding:12px 14px;font-size:13px;display:flex;gap:12px;align-items:flex-start;margin-top:12px}
.note button{flex:0 0 auto;font-weight:700;color:var(--accent);font-size:13px;padding:2px 4px}
.empty{text-align:center;color:var(--muted);padding:28px 12px}

/* month view */
.kpis{display:flex;align-items:center;gap:16px}
.donut{flex:0 0 auto;width:112px;height:112px;position:relative}
.donut svg{width:100%;height:100%;transform:rotate(-90deg)}
.donut .c{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
.donut .c b{font-family:var(--display);font-size:26px;line-height:1}
.donut .c span{font-size:10px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-top:3px}
.kv{flex:1;display:grid;grid-template-columns:1fr 1fr;gap:10px}
.kv div{background:var(--surface-2);border-radius:14px;padding:10px 12px}
.kv b{display:block;font-family:var(--display);font-size:22px;line-height:1.1}
.kv span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:600}
.sec{margin-top:22px;margin-bottom:10px;display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h3{font-size:17px}
.sec span{font-size:12px;color:var(--muted)}
svg.chart{width:100%;height:auto;display:block}
svg.chart text{font-family:var(--body);font-size:9px;fill:var(--muted)}
.wk{display:grid;grid-template-columns:84px 1fr auto;align-items:center;gap:10px;padding-block:7px;font-size:13px}
.wk .t{font-weight:600}
.wk .t small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.wk .b{height:10px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.wk .b i{display:block;height:100%;border-radius:5px}
.wk .v{text-align:right;font-weight:600;min-width:74px}
.wk .v small{display:block;color:var(--muted);font-weight:400;font-size:11px}
.rank{display:grid;grid-template-columns:22px 1fr auto;align-items:center;gap:10px;padding-block:8px;font-size:13px;border-top:1px solid var(--line)}
.rank:first-child{border-top:0}
.rank .i{color:var(--muted);font-weight:700;font-size:12px}
.rank .n{min-width:0}
.rank .n b{font-weight:600;display:block;overflow-wrap:anywhere}
.rank .b{height:6px;border-radius:3px;background:var(--surface-2);overflow:hidden;margin-top:5px}
.rank .b i{display:block;height:100%;background:var(--accent);border-radius:3px}
.rank .v{text-align:right;font-weight:600}
.rank .v small{display:block;color:var(--muted);font-weight:400;font-size:11px}

.gridwrap{overflow-x:auto;border-radius:16px;background:var(--surface);box-shadow:var(--shadow);position:relative}
table.grid{border-collapse:separate;border-spacing:0;font-size:11px;min-width:100%}
.grid th,.grid td{padding:0;text-align:center}
.grid .stk{position:sticky;left:0;background:var(--surface);z-index:2;text-align:left;padding:0 10px;min-width:118px;max-width:118px;font-weight:600;font-size:12px;border-right:1px solid var(--line);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.grid thead th{height:24px;color:#14181F;font-weight:700;font-size:10px;letter-spacing:.04em}
.grid thead tr.days th{color:var(--muted);background:var(--surface);height:30px;font-weight:600;line-height:1.1}
.grid thead tr.days th.today{color:var(--accent);font-weight:800}
.grid thead tr.days th.stk{color:var(--muted)}
.grid td.c{width:28px;min-width:28px;height:34px}
.cell{width:22px;height:22px;border-radius:7px;background:var(--surface-2);display:block;margin:auto}
.cell.on{background:var(--wc)}
.cell[disabled]{opacity:.35;cursor:not-allowed}
.grid tr:nth-child(even) td.c .cell:not(.on){opacity:.9}
.grid td.tcol .cell:not(.on){box-shadow:inset 0 0 0 1.5px var(--accent)}
.hint{font-size:12px;color:var(--muted);margin-top:8px}

/* habits editor */
.erow{display:flex;align-items:center;gap:6px;background:var(--surface);border-radius:16px;padding:6px 6px 6px 12px;box-shadow:var(--shadow)}
.erow + .erow{margin-top:8px}
.erow .idx{flex:0 0 auto;color:var(--muted);font-size:12px;font-weight:700;width:20px}
.erow input{flex:1;min-width:0;height:42px;border:0;background:transparent;font-weight:600;font-size:16px;outline-offset:0;border-radius:10px;padding-inline:6px}
.erow input:focus{background:var(--surface-2);outline:none}
.sm{flex:0 0 auto;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.sm:hover{background:var(--surface-2)}
.sm[disabled]{opacity:.3;cursor:not-allowed}
.sm.del.arm{background:var(--danger-soft);color:var(--danger);width:auto;padding-inline:12px;font-weight:700;font-size:13px}
.addrow{display:flex;gap:8px;margin-top:12px}
.field{flex:1;min-width:0;height:46px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface);padding-inline:14px;font-size:16px}
.field:focus{border-color:var(--accent);outline:none}
.btn{height:46px;border-radius:14px;padding-inline:18px;font-weight:700;background:var(--accent);color:var(--accent-ink);display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--surface-2);color:var(--ink)}
.btn.danger{background:var(--danger-soft);color:var(--danger)}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.stack{display:flex;flex-direction:column;gap:10px}
.row2{display:flex;gap:8px;flex-wrap:wrap}
label.l{display:block;font-size:12px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase;margin-bottom:6px}
textarea.field{height:110px;padding-block:10px;font-size:12px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;resize:vertical;width:100%}
.msg{font-size:13px;min-height:18px}
.msg.err{color:var(--danger)}
.msg.ok{color:var(--accent)}
.card p{margin:6px 0 0;color:var(--muted);font-size:13px}
.card h3{font-size:17px}
.status{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:3px 10px;border-radius:99px;background:var(--surface-2);color:var(--muted);margin-left:8px;vertical-align:middle}
.status.on{background:var(--accent-soft);color:var(--accent)}

/* tabbar */
.tabbar{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);padding-top:6px;padding-bottom:calc(env(safe-area-inset-bottom,0px) + 6px);z-index:20}
.tabbar .in{max-width:720px;margin-inline:auto;display:grid;grid-template-columns:repeat(4,1fr);padding-inline:8px}
.tab{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11px;font-weight:600;color:var(--muted);border-radius:12px}
.tab svg{width:22px;height:22px}
.tab[aria-current="page"]{color:var(--accent)}
main{padding-bottom:96px}

/* lock */
#lock{position:fixed;inset:0;background:var(--bg);z-index:50;display:grid;place-items:center;padding:20px}
#lock .card{width:100%;max-width:360px;padding:24px}
#lock h2{font-size:24px;margin-block:14px 6px}
#lock .lk{width:52px;height:52px;border-radius:16px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
#lock .field{width:100%;margin-top:14px}
#lock .btn{width:100%;margin-top:10px}
.linkbtn{color:var(--muted);font-size:13px;text-decoration:underline;margin-top:14px;display:inline-block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* login */
#lock{display:block;padding:0;overflow-y:auto;-webkit-overflow-scrolling:touch}
.lg{min-height:100%;display:flex;flex-direction:column}
.lg-hero{text-align:center;padding:calc(env(safe-area-inset-top,0px) + 28px) 20px 64px;border-radius:0 0 34px 34px}
.lg-logo{width:96px;margin:0 auto 14px;display:grid;grid-template-columns:repeat(9,1fr);gap:3px;padding:9px;border-radius:22px}
.lg-logo i{aspect-ratio:1;border-radius:2px;background:#1B2733}

@keyframes pop{from{transform:scale(.3);opacity:0}to{transform:scale(1);opacity:1}}
.lg-hero h1{font-size:30px;font-weight:800;letter-spacing:-.03em;color:#fff}
.lg-hero p{margin:4px 0 0;font-size:14px;color:rgba(255,255,255,.72)}
.lg-card{width:calc(100% - 32px);max-width:400px;margin:-40px auto 24px;background:var(--surface);border-radius:26px;box-shadow:0 10px 34px rgba(18,24,33,.16);padding:20px 18px 14px;position:relative}
.lg-l{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:0 0 8px}
.lg-phone{display:flex;align-items:center;height:54px;border-radius:16px;border:1.5px solid var(--line);background:var(--bg);overflow:hidden}
.lg-phone:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.lg-phone span{padding:0 12px 0 16px;font-weight:700;color:var(--muted);border-right:1.5px solid var(--line);height:100%;display:grid;place-items:center}
.lg-phone input{flex:1;min-width:0;height:100%;border:0;background:transparent;padding:0 14px;font-size:20px;font-weight:600;letter-spacing:.06em;outline:0}
.lg-phone input::placeholder{color:var(--muted);opacity:.5;font-weight:500}
.lg-phone.ro{opacity:.75}
.lg-pin{margin-top:18px;text-align:center}
.dots{display:flex;justify-content:center;gap:16px;margin:6px 0 4px;height:22px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--line);transition:transform .12s,background .12s,border-color .12s}
.dots i.f{background:var(--accent);border-color:var(--accent);transform:scale(1.15)}
.dots.shake{animation:shake .38s}
@keyframes shake{20%,60%{transform:translateX(-8px)}40%,80%{transform:translateX(8px)}}
.lg-msg{text-align:center;min-height:20px;margin:6px 0 4px;font-size:13px;font-weight:500}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;max-width:300px;margin:4px auto 0}
.key{height:56px;border-radius:18px;background:var(--surface-2);font-family:var(--display);font-size:24px;font-weight:700;display:grid;place-items:center;transition:transform .08s,background .12s;-webkit-tap-highlight-color:transparent;user-select:none}
.key:active{transform:scale(.94);background:var(--accent-soft);color:var(--accent)}
.key.blank{background:transparent;pointer-events:none}
.key.bk{background:transparent;color:var(--muted)}
.key svg{width:26px;height:26px}
.lg-foot{text-align:center;margin-top:8px;min-height:24px}
.lg-foot .linkbtn{margin-top:4px}
.lg-note{text-align:center;color:var(--muted);font-size:12px;margin:0 auto 20px;max-width:320px;padding-inline:16px}
@media (max-height:700px){.lg-hero{padding-bottom:52px;padding-top:calc(env(safe-area-inset-top,0px) + 16px)}.lg-logo{width:72px;margin-bottom:8px}.lg-hero h1{font-size:24px}.key{height:48px}.lg-hero p{display:none}}

/* ===== v3: bright, animated theme ===== */
html{background:#F3F7FB}
body{background:transparent}
button{-webkit-tap-highlight-color:transparent}
.bgfx{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none;background:linear-gradient(180deg,#E6F8F4 0%,#F0EFFF 52%,#FFF2E8 100%)}
.bgfx i{position:absolute;border-radius:50%;filter:blur(46px);opacity:.6;animation:floaty 16s ease-in-out infinite}
.bgfx i:nth-child(1){width:260px;height:260px;background:#7FE5D6;left:-80px;top:40px}
.bgfx i:nth-child(2){width:300px;height:300px;background:#C9B8FF;right:-110px;top:38%;animation-delay:-5s;animation-duration:19s}
.bgfx i:nth-child(3){width:240px;height:240px;background:#FFC9A3;left:-60px;bottom:-40px;animation-delay:-9s;animation-duration:22s}
@keyframes floaty{0%,100%{transform:translate(0,0) scale(1)}33%{transform:translate(34px,-26px) scale(1.12)}66%{transform:translate(-22px,30px) scale(.94)}}
@keyframes rise{from{opacity:0;transform:translateY(18px) scale(.98)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes drawl{from{stroke-dashoffset:1}to{stroke-dashoffset:0}}
@keyframes drawc{from{stroke-dashoffset:24}to{stroke-dashoffset:0}}
@keyframes ring{from{stroke-dashoffset:var(--c)}}
@keyframes boxpop{0%{transform:scale(.6)}55%{transform:scale(1.28)}100%{transform:scale(1)}}
@keyframes cellpop{0%{transform:scale(.4)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
@keyframes chipin{0%{transform:translateY(0) scale(1)}55%{transform:translateY(-8px) scale(1.14)}100%{transform:translateY(-3px) scale(1.06)}}
@keyframes bob{0%{transform:translateY(0)}40%{transform:translateY(-6px) scale(1.15)}100%{transform:translateY(0)}}
@keyframes sheen{from{transform:translateX(-120%) skewX(-18deg)}to{transform:translateX(320%) skewX(-18deg)}}
@keyframes gshift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
@keyframes wob{0%,100%{transform:rotate(0)}25%{transform:rotate(-8deg)}75%{transform:rotate(8deg)}}

.top{padding-block:16px 8px}
.logo{background:var(--grad);box-shadow:0 6px 14px rgba(59,130,246,.35);animation:wob 5s ease-in-out infinite}
.logo i{background:#fff}
.brand b{background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-fill-color:transparent}
.iconbtn{background:#fff;color:var(--a3);transition:transform .15s}
.iconbtn:active{transform:scale(.9) rotate(-8deg)}
.card{border-radius:24px;background:rgba(255,255,255,.94)}
.mnav h2{font-weight:800}
.pill{transition:transform .12s}
.pill:active{transform:scale(.92)}
.pill.accent{background:var(--grad);color:#fff}
.sec h3{display:flex;align-items:center;gap:8px}
.sec h3::before{content:"";width:6px;height:18px;border-radius:3px;background:var(--grad)}

/* hero summary card */
.hero{position:relative;overflow:hidden;color:#fff;background:linear-gradient(135deg,#0EA5A0 0%,#3B82F6 55%,#7C5CFC 100%);background-size:200% 200%;animation:gshift 9s ease infinite;box-shadow:0 14px 30px rgba(59,130,246,.35)}
.hero::before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-40px;top:-60px;background:rgba(255,255,255,.16);animation:floaty 9s ease-in-out infinite}
.hero::after{content:"";position:absolute;top:0;bottom:0;width:36%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.28),transparent);animation:sheen 4.5s ease-in-out infinite}
.hero .eyebrow{color:rgba(255,255,255,.85)}
.hero h3{color:#fff}
.hero .big small{color:rgba(255,255,255,.8)}
.hero .meter{background:rgba(255,255,255,.3);height:10px;border-radius:5px}
.hero .meter i{background:#fff;border-radius:5px;transition:width .8s cubic-bezier(.2,.9,.25,1)}
.hero p{color:rgba(255,255,255,.95);font-weight:600;font-size:14px;margin-top:10px}
.hero.party{background:linear-gradient(135deg,#F59E0B 0%,#EC4899 55%,#7C5CFC 100%);background-size:200% 200%;box-shadow:0 14px 30px rgba(236,72,153,.35)}

/* day strip */
.chip{border-radius:16px;transition:transform .2s,box-shadow .2s}
.chip:active{transform:scale(.92)}
.chip.today{box-shadow:inset 0 0 0 2px var(--a1),var(--shadow)}
.chip.sel{background:linear-gradient(160deg,#14B8A6,#7C5CFC);color:#fff;transform:translateY(-3px) scale(1.06);box-shadow:0 10px 20px rgba(124,92,252,.35)}
.chip.sel .dw{color:#fff;opacity:.85}
.chip.sel .bar{background:rgba(255,255,255,.35)}
.chip.sel .bar i{background:#fff}

/* habit rows */
.hrow{position:relative;overflow:hidden;border-radius:20px;padding:13px 14px 13px 18px;box-shadow:inset 5px 0 0 var(--hc,var(--a1)),var(--shadow);transition:background .25s,transform .12s}
.hrow:active:not([disabled]){transform:scale(.98)}
.hrow[aria-pressed="true"]{background:var(--hs,#E6F8F5)}
.box{width:34px;height:34px;border:2.5px solid var(--hc,var(--a1));background:var(--hs,transparent);transition:background .2s,border-color .2s}
.box svg{width:20px;height:20px}
.box svg path{stroke-dasharray:24;stroke-dashoffset:24}
.hrow[aria-pressed="true"] .box{background:var(--hc,var(--a1));border-color:var(--hc,var(--a1));color:#fff}
.hrow[aria-pressed="true"] .box svg path{stroke-dashoffset:0}
.box.pop{animation:boxpop .5s cubic-bezier(.3,1.5,.5,1)}
.box.pop svg path{animation:drawc .35s .05s both}
.streak{display:inline-flex;align-items:center;gap:3px;background:linear-gradient(135deg,#FFEDD5,#FFE0C2);color:#C2410C;font-weight:800}
.streak svg{width:11px;height:11px;fill:#F97316}
.note{background:linear-gradient(135deg,#E0F7F3,#EDE9FF)}
.cheer{}

/* month */
.donut circle+circle{stroke:url(#dg)}
.kv div{background:linear-gradient(135deg,#F1F5FC,#F6F1FF)}
.wk .b,.rank .b{background:var(--surface-2)}
.rank .b i{background:linear-gradient(90deg,#14B8A6,#3B82F6)}
.cell{transition:transform .12s}
.cell:active{transform:scale(.8)}
.cell.pop{animation:cellpop .35s cubic-bezier(.3,1.5,.5,1)}

/* forms + buttons */
.btn{background:var(--grad);color:#fff;box-shadow:0 8px 18px rgba(59,130,246,.28);transition:transform .12s}
.btn:active:not([disabled]){transform:scale(.96)}
.btn.ghost{background:var(--surface-2);color:var(--ink);box-shadow:none}
.btn.danger{background:var(--danger-soft);color:var(--danger);box-shadow:none}
.field:focus{border-color:var(--a3);box-shadow:0 0 0 3px rgba(124,92,252,.15)}
.status.on{background:#D8F3EF;color:#0B7A6E}

/* tab bar */
.tabbar{left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);border:0;border-radius:26px;padding:6px 4px;background:rgba(255,255,255,.92);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:0 12px 32px rgba(45,60,110,.2)}
.tabbar .in{padding-inline:2px}
.tab{border-radius:20px;transition:background .2s,color .2s;gap:1px}
.tab[aria-current="page"]{background:var(--grad);color:#fff;box-shadow:0 6px 14px rgba(59,130,246,.35)}
.tab[aria-current="page"] svg{animation:bob .5s cubic-bezier(.3,1.4,.5,1)}
main{padding-bottom:118px}

/* entrance choreography (only on tab/day/month change, not on every tick) */
.enter>*{animation:rise .55s cubic-bezier(.2,.8,.25,1) both}
.enter>*:nth-child(1){animation-delay:0s}
.enter>*:nth-child(2){animation-delay:.06s}
.enter>*:nth-child(3){animation-delay:.12s}
.enter>*:nth-child(4){animation-delay:.18s}
.enter>*:nth-child(n+5){animation-delay:.24s}
.enter .hlist{animation:none}
.enter .hrow{animation:rise .5s cubic-bezier(.2,.8,.25,1) both;animation-delay:calc(var(--i,0)*55ms + .2s)}
.enter .chip.sel{animation:chipin .5s .25s cubic-bezier(.3,1.5,.5,1) both}
.enter .donut circle+circle{animation:ring 1.2s .25s cubic-bezier(.2,.8,.2,1) both}
.enter .ln{stroke-dasharray:1;animation:drawl 1.3s .3s ease both}
.enter .ar{animation:arfade .9s .8s both}
@keyframes arfade{from{opacity:0}to{opacity:.18}}
.enter .wk .b i,.enter .rank .b i{transform-origin:left;animation:grow .9s .3s cubic-bezier(.2,.8,.2,1) both}
.enter .erow{animation:rise .45s cubic-bezier(.2,.8,.25,1) both}

.conf{position:fixed;z-index:200;width:9px;height:14px;border-radius:2px;pointer-events:none;will-change:transform}


.hrow{background:#fff}
.hrow[aria-pressed="true"]{background:linear-gradient(var(--hs,#E6F8F5),var(--hs,#E6F8F5)),#fff}
.hrow[aria-pressed="true"] .hname{color:#4A5668}
.strip{padding-top:14px;margin-top:-8px}
.erow .sm{width:34px}
.erow .sm.del.arm{width:auto}
.key.blank,.key.bk{box-shadow:none;background:transparent}
/* login: bright + alive */
#lock{background:linear-gradient(180deg,#E9F8F5 0%,#F3EFFF 100%)}
.lg-hero{position:relative;overflow:hidden;background:linear-gradient(135deg,#14B8A6,#3B82F6,#7C5CFC,#EC4899);background-size:300% 300%;animation:gshift 10s ease infinite;color:#fff}
.lg-hero>*{position:relative;z-index:1}
.bub{position:absolute!important;bottom:-60px;border-radius:50%;background:rgba(255,255,255,.2);animation:up 9s linear infinite;z-index:0!important}
@keyframes up{from{transform:translateY(0) scale(.8);opacity:0}15%{opacity:1}to{transform:translateY(-330px) scale(1.2);opacity:0}}
.lg-logo{background:#fff;animation:lift 2.8s ease-in-out infinite;box-shadow:0 14px 30px rgba(30,40,120,.3)}
@keyframes lift{0%,100%{transform:translateY(0)}50%{transform:translateY(-7px)}}
.lg-logo i{background:#E6ECF6}
.lg-logo i.on{animation:pop .5s ease both}
.lg-hero h1{text-shadow:0 2px 12px rgba(0,0,0,.18)}
.lg-hero p{color:rgba(255,255,255,.92)}
.lg-card{animation:rise .7s .15s cubic-bezier(.2,.8,.25,1) both;box-shadow:0 18px 44px rgba(60,60,140,.2)}
.dots i{border-color:#C9D3E3}
.dots i.f{background:linear-gradient(135deg,#14B8A6,#7C5CFC);border-color:transparent;animation:boxpop .3s}
.key{background:#EEF3FA;box-shadow:0 2px 0 #DCE5F2}
.key:active{background:var(--grad);color:#fff}
.lg-phone:focus-within{border-color:var(--a3);box-shadow:0 0 0 3px rgba(124,92,252,.18)}
.lg-msg{}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
[hidden]{display:none!important}
html{padding-top:env(safe-area-inset-top,0px)}
body{margin:0}

<body>

<div class="bgfx" aria-hidden="true"><i></i><i></i><i></i></div>
<div id="lock" hidden></div>
<div id="app" class="wrap" hidden>
  <header class="top">
    <div class="brand"><div class="logo" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div><b>Habit Grid</b><span id="who"></span></div>
    <button class="iconbtn" id="lockBtn" aria-label="Log out" title="Log out"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="11" width="16" height="10" rx="3"/><path d="M8 11V8a4 4 0 018 0v3"/></svg></button>

</div>

  <button class="tab" data-tab="month"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="4.5" width="17" height="16" rx="3"/><path d="M3.5 9.5h17M8 3v3M16 3v3"/></svg>Month</button>
  <button class="tab" data-tab="habits"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><path d="M3.5 6h.01M3.5 12h.01M3.5 18h.01"/></svg>Habits</button>
  <button class="tab" data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 4.5-3 8.2-7 10-4-1.8-7-5.5-7-10V6l7-3z"/></svg>Privacy</button>
</div></nav>

<script>
(function(){
'use strict';
var $=function(s,r){return (r||document).querySelector(s);};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});};
var MONTHS=['January','February','March','April','May','June','July','August','September','October','November','December'];
var DOW=['S','M','T','W','T','F','S'];
var DOWL=['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
var STORE='habitgrid.v1';
var MAXH=25;
var STARTER=['Study 2 hours','Attend classes on time','Complete assignments','Revise notes','Drink 2L of water','No Instagram scrolling','Read 10 pages','Exercise / Walk','Sleep before 11 PM','Save money'];
var HC=['#0E9F8E','#7C5CFC','#EC4899','#F59E0B','#3B82F6','#22C55E','#F97316'];
var FLAME='<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2c1 4-3 5-3 9a4 4 0 008 0c0-2-1-3-1-5 2 1 4 4 4 7a8 8 0 01-16 0c0-6 6-7 8-11z"/></svg>';
var CONF=['#14B8A6','#3B82F6','#7C5CFC','#EC4899','#F59E0B','#22C55E','#F97316'];
function reduced(){return !!(window.matchMedia&&window.matchMedia('(prefers-reduced-motion: reduce)').matches);}
function confetti(x,y,n,big){
  if(reduced()||!Element.prototype.animate)return;
  for(var i=0;i<n;i++){
    var el=document.createElement('span');el.className='conf';
    el.style.left=x+'px';el.style.top=y+'px';el.style.background=CONF[i%CONF.length];
    if(i%3===0){el.style.borderRadius='50%';el.style.width=el.style.height='9px';}
    document.body.appendChild(el);
    var ang=Math.random()*Math.PI*2,sp=(big?150:60)+Math.random()*(big?260:90);
    var dx=Math.cos(ang)*sp,dy=Math.sin(ang)*sp-(big?140:40),rot=Math.random()*720-360;
    var a=el.animate([{transform:'translate(0,0) rotate(0deg)',opacity:1},{transform:'translate('+dx.toFixed(0)+'px,'+(dy+(big?320:120)).toFixed(0)+'px) rotate('+rot.toFixed(0)+'deg)',opacity:0}],{duration:(big?1500:850)+Math.random()*500,easing:'cubic-bezier(.2,.7,.3,1)',fill:'forwards'});
    a.onfinish=(function(e2){return function(){if(e2.parentNode)e2.parentNode.removeChild(e2);};})(el);
  }
}
var ICON_CHECK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7"/></svg>';

/* ---------- storage (one profile per name, all on this device) ---------- */
var PFX='habitgrid.u.', SESS='habitgrid.session';
var mem={}, persistOK=true;
function lsGet(k){try{return localStorage.getItem(k);}catch(e){return mem[k]||null;}}
function lsSet(k,v){try{localStorage.setItem(k,v);return true;}catch(e){mem[k]=v;return false;}}
function lsDel(k){try{localStorage.removeItem(k);}catch(e){} delete mem[k];}
function slugOf(n){return n.trim().replace(/\s+/g,' ').toLowerCase();}
function cleanName(n){return n.trim().replace(/\s+/g,' ').slice(0,30);}

/* ---------- PIN hashing ---------- */
var hasCrypto=!!(window.crypto&&window.crypto.subtle);
var te=new TextEncoder();
function b64(buf){var a=new Uint8Array(buf),s='';for(var i=0;i<a.length;i++)s+=String.fromCharCode(a[i]);return btoa(s);}
function unb64(s){var b=atob(s),a=new Uint8Array(b.length);for(var i=0;i<b.length;i++)a[i]=b.charCodeAt(i);return a;}
function newSalt(){var a=new Uint8Array(16);(window.crypto||{getRandomValues:function(x){for(var i=0;i<x.length;i++)x[i]=Math.floor(Math.random()*256);}}).getRandomValues(a);return a;}
function hashPin(pin,slug,salt){
  if(!hasCrypto){var h=5381,t=slug+'|'+pin+'|'+b64(salt);for(var i=0;i<t.length;i++)h=((h*33)^t.charCodeAt(i))>>>0;return Promise.resolve('f'+h);}
  return crypto.subtle.importKey('raw',te.encode(slug+'|'+pin),'PBKDF2',false,['deriveBits']).then(function(km){
    return crypto.subtle.deriveBits({name:'PBKDF2',salt:salt,iterations:150000,hash:'SHA-256'},km,256);
  }).then(b64);
}

/* ---------- state ---------- */
var state=null, prof=null;
var view={tab:'today',y:0,m:0,d:1};
var pendingDel=null, flash={};

function uid(){return 'h'+Math.random().toString(36).slice(2,9);}
function defaultState(){return {v:1,name:'',starter:true,habits:STARTER.map(function(n){return {id:uid(),name:n};}),checks:{}};}
function normalize(d){
  var s={v:1,name:(typeof d.name==='string'?d.name.slice(0,30):''),starter:!!d.starter,habits:[],checks:{}};
  if(Array.isArray(d.habits)){d.habits.slice(0,MAXH).forEach(function(h){
    if(h&&typeof h.name==='string'){var id=String(h.id||uid()).replace(/[^\w-]/g,'').slice(0,20)||uid();s.habits.push({id:id,name:h.name.slice(0,40)});}
  });}
  if(d.checks&&typeof d.checks==='object'){
    Object.keys(d.checks).forEach(function(k){
      if(!/^\d{4}-\d{2}$/.test(k))return;
      var o={},src=d.checks[k];
      if(src&&typeof src==='object'){Object.keys(src).forEach(function(h){
        if(h==='__proto__'||!/^[\w-]{1,20}$/.test(h))return;
        var a=src[h];if(Array.isArray(a))o[h]=a.filter(function(n){return Number.isInteger(n)&&n>=1&&n<=31;});
      });}
      s.checks[k]=o;
    });
  }
  return s;
}
var saveT=null;
function save(){clearTimeout(saveT);saveT=setTimeout(doSave,120);}
function doSave(){
  clearTimeout(saveT);
  if(!state||!prof)return Promise.resolve();
  try{persistOK=lsSet(PFX+prof.slug,JSON.stringify({name:prof.name,salt:prof.salt,hash:prof.hash,data:state}));}catch(e){persistOK=false;}
  return Promise.resolve();
}

/* ---------- dates ---------- */
function today(){var n=new Date();return {y:n.getFullYear(),m:n.getMonth(),d:n.getDate()};}
function daysIn(y,m){return new Date(y,m+1,0).getDate();}
function mkey(y,m){return y+'-'+String(m+1).padStart(2,'0');}
function isFuture(y,m,d){var t=today();return (y>t.y)||(y===t.y&&m>t.m)||(y===t.y&&m===t.m&&d>t.d);}
function weekOf(d){return Math.min(4,Math.floor((d-1)/7));}
function pct(p){return Math.round(p*100)+'%';}

/* ---------- data helpers ---------- */
function isOn(hid,y,m,d){var o=state.checks[mkey(y,m)];return !!(o&&o[hid]&&o[hid].indexOf(d)>=0);}
function toggle(hid,y,m,d){
  var k=mkey(y,m),o=state.checks[k]||(state.checks[k]={}),a=o[hid]||(o[hid]=[]),i=a.indexOf(d);
  if(i>=0)a.splice(i,1);else a.push(d);
  save();
}
function streak(hid,y,m,d){
  var cur=isOn(hid,y,m,d)?d:d-1,n=0;
  while(cur>=1&&isOn(hid,y,m,cur)){n++;cur--;}
  return n;
}
function monthStats(y,m){
  var dim=daysIn(y,m),H=state.habits,goal=H.length,o=state.checks[mkey(y,m)]||{};
  var comp=[];for(var i=0;i<=dim;i++)comp.push(0);
  var per=H.map(function(h){
    var seen={},n=0;(o[h.id]||[]).forEach(function(d){if(d<=dim&&!seen[d]){seen[d]=1;comp[d]++;n++;}});
    return {h:h,done:n};
  });
  var total=per.reduce(function(s,p){return s+p.done;},0);
  var t=today(),last=0;
  if(t.y===y&&t.m===m)last=t.d;else if(y<t.y||(y===t.y&&m<t.m))last=dim;
  var weeks=[];
  for(var w=0;w<5;w++){
    var from=w*7+1;if(from>dim)break;
    var to=Math.min(dim,w*7+7),c=0;for(var d=from;d<=to;d++)c+=comp[d];
    weeks.push({w:w,from:from,to:to,done:c,possible:goal*(to-from+1)});
  }
  return {dim:dim,goal:goal,comp:comp,per:per,total:total,possible:goal*dim,last:last,soFar:goal*last,weeks:weeks};
}

/* ---------- render ---------- */
var prevMeter=0;
function render(opts){
  opts=opts||{};
  var main=$('#main');
  var strip=$('.strip',main),grid=$('.gridwrap',main);
  var keepStrip=strip?strip.scrollLeft:null,keepGrid=grid?grid.scrollLeft:null;
  var html='';
  if(view.tab==='today')html=renderToday();
  else if(view.tab==='month')html=renderMonth();
  else if(view.tab==='habits')html=renderHabits();
  else html=renderMore();
  main.className=opts.center?'enter':'';
  main.innerHTML=html;
  var mi=$('.meter i',main);
  if(mi){var tg=mi.style.width;mi.style.width=opts.center?'0%':prevMeter+'%';void mi.offsetWidth;mi.style.width=tg;prevMeter=parseFloat(tg)||0;}
  if(opts.tick&&opts.on){
    var bx=$('.hrow[data-h="'+opts.tick+'"] .box',main);
    if(bx){bx.classList.add('pop');var rc=bx.getBoundingClientRect();confetti(rc.left+rc.width/2,rc.top+rc.height/2,14,false);}
    if($('.hero.party',main))setTimeout(function(){confetti(window.innerWidth/2,window.innerHeight*0.32,80,true);},260);
  }
  if(opts.cell&&opts.on){var ce=$('.cell[data-h="'+opts.cell.h+'"][data-d="'+opts.cell.d+'"]',main);if(ce)ce.classList.add('pop');}
  Array.prototype.forEach.call(document.querySelectorAll('.tab'),function(b){
    if(b.dataset.tab===view.tab)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');
  });
  $('#who').textContent=prof?('· ••'+prof.slug.slice(-4)):'';
  var ns=$('.strip',main),ng=$('.gridwrap',main);
  if(ns){
    var sel=$('.chip.sel',ns);
    if(opts.center&&sel){ns.scrollLeft=sel.offsetLeft-ns.clientWidth/2+sel.clientWidth/2;}
    else if(keepStrip!==null){ns.scrollLeft=keepStrip;}
  }
  if(ng){
    var tc=$('th.today',ng);
    if(opts.center&&tc){ng.scrollLeft=Math.max(0,tc.offsetLeft-ng.clientWidth/2+14);}
    else if(keepGrid!==null){ng.scrollLeft=keepGrid;}
  }
}

function monthNav(){
  var t=today(),isNow=(view.y===t.y&&view.m===t.m);
  return '<div class="mnav"><h2>'+MONTHS[view.m]+' <span style="color:var(--muted);font-weight:600">'+view.y+'</span></h2><div class="grp">'
   +(isNow?'':'<button class="pill accent" data-act="now">Today</button>')
   +'<button class="pill" data-act="prev" aria-label="Previous month">&#8249;</button><button class="pill" data-act="next" aria-label="Next month">&#8250;</button></div></div>';
}

function renderToday(){
  var y=view.y,m=view.m,dim=daysIn(y,m);
  if(view.d>dim)view.d=dim;
  var d=view.d,st=monthStats(y,m),t=today(),H=state.habits;
  var h=monthNav();
  h+='<div class="strip" role="group" aria-label="Pick a day">';
  for(var i=1;i<=dim;i++){
    var dow=new Date(y,m,i).getDay(),p=st.goal?st.comp[i]/st.goal:0;
    var cls='chip'+(i===d?' sel':'')+((t.y===y&&t.m===m&&t.d===i)?' today':'')+(isFuture(y,m,i)?' future':'');
    h+='<button class="'+cls+'" data-act="day" data-d="'+i+'" style="--wc:var(--w'+(weekOf(i)+1)+')" aria-label="'+DOWL[dow]+' '+i+'"><span class="dw">'+DOW[dow]+'</span><span class="dn num">'+i+'</span><span class="bar"><i style="width:'+Math.round(p*100)+'%"></i></span></button>';
  }
  h+='</div>';
  var done=0;H.forEach(function(x){if(isOn(x.id,y,m,d))done++;});
  var dd=new Date(y,m,d),fut=isFuture(y,m,d);
  var cheer=!H.length?'':done===0?'Tap a habit below to get started':done===H.length?'Perfect day. Every habit done!':(done/H.length>=.5?'Over halfway. Keep going!':'Good start. Keep it up!');

   +(fut?'<p>This day is still ahead. You can tick it once it arrives.</p>':(cheer?'<p class="cheer">'+cheer+'</p>':''))
   +'</section>';
  if(state.starter){

function areaChart(st,y,m){
  var W=340,Hh=150,xl=30,xr=8,yt=8,yb=126,dim=st.dim,cw=W-xl-xr,ch=yb-yt;
  var x=function(d){return dim===1?xl:xl+(d-1)*cw/(dim-1);};
  var yv=function(p){return yb-p*ch;};
  var s='<svg class="chart" viewBox="0 0 '+W+' '+Hh+'" role="img" aria-label="Daily completion percentage">';
  // week bands
  st.weeks.forEach(function(w){
    var x0=w.from===1?xl:(x(w.from)+x(w.from-1))/2,x1=w.to===dim?W-xr:(x(w.to)+x(w.to+1))/2;
    s+='<rect x="'+x0.toFixed(1)+'" y="'+yt+'" width="'+(x1-x0).toFixed(1)+'" height="'+ch+'" fill="var(--w'+(w.w+1)+')" opacity=".16"/>';
  });
  [0,.5,1].forEach(function(g){
    s+='<line x1="'+xl+'" x2="'+(W-xr)+'" y1="'+yv(g)+'" y2="'+yv(g)+'" stroke="var(--line)" stroke-width="1"/>';
    s+='<text x="'+(xl-5)+'" y="'+(yv(g)+3)+'" text-anchor="end">'+Math.round(g*100)+'%</text>';
  });
  st.weeks.forEach(function(w){s+='<text x="'+x(w.from).toFixed(1)+'" y="'+(yb+14)+'" text-anchor="middle">'+w.from+'</text>';});
  var last=Math.min(st.last,dim);
  if(last>0&&st.goal>0){
    var pts=[];for(var d=1;d<=last;d++)pts.push([x(d),yv(st.comp[d]/st.goal)]);
    var line=pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
    s+='<path d="'+line+' L'+pts[pts.length-1][0].toFixed(1)+' '+yb+' L'+pts[0][0].toFixed(1)+' '+yb+' Z" fill="var(--accent)" opacity=".18" class="ar"/>';
    s+='<path class="ln" pathLength="1" d="'+line+'" fill="none" stroke="var(--a2)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>';
    var e=pts[pts.length-1];
    s+='<circle cx="'+e[0].toFixed(1)+'" cy="'+e[1].toFixed(1)+'" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/>';
  }else{
    s+='<text x="'+(W/2)+'" y="'+(yv(.5)-6)+'" text-anchor="middle" style="font-size:11px">'+(st.goal?'Nothing to plot yet':'Add habits to see progress')+'</text>';
  }
  return s+'</svg>';
}

function donut(p){
  var r=44,c=2*Math.PI*r,off=c*(1-Math.min(1,p));
  return '<div class="donut" style="--c:'+c.toFixed(1)+'"><svg viewBox="0 0 112 112"><defs><linearGradient id="dg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14B8A6"/><stop offset="1" stop-color="#7C5CFC"/></linearGradient></defs><circle cx="56" cy="56" r="'+r+'" fill="none" stroke="var(--surface-2)" stroke-width="12"/><circle cx="56" cy="56" r="'+r+'" fill="none" stroke="#14B8A6" stroke-width="12" stroke-linecap="round" stroke-dasharray="'+c.toFixed(1)+'" stroke-dashoffset="'+off.toFixed(1)+'"/></svg><div class="c"><b class="num">'+pct(p)+'</b><span>of month</span></div></div>';
}

/* ---------- events ---------- */
document.addEventListener('click',function(e){
  var tb=e.target.closest('.tab');
  if(tb&&state){view.tab=tb.dataset.tab;pendingDel=null;flash={};render({center:true});window.scrollTo(0,0);return;}
  var go=e.target.closest('[data-tab-go]');
  if(go&&state){view.tab=go.dataset.tabGo;render({center:true});return;}
  var el=e.target.closest('[data-act]');
  if(!el||!state)return;
  var a=el.dataset.act,id=el.dataset.h,H=state.habits,i;
  if(a==='rename')return;
  if(a!=='del')pendingDel=(a==='askwipe'||a==='cancelwipe')?pendingDel:null;
  if(a==='tick'){var wasOn=isOn(id,view.y,view.m,view.d);toggle(id,view.y,view.m,view.d);render({tick:id,on:!wasOn});}
  else if(a==='cell'){var wc=isOn(id,view.y,view.m,+el.dataset.d);toggle(id,view.y,view.m,+el.dataset.d);render({cell:{h:id,d:+el.dataset.d},on:!wc});}
  else if(a==='day'){view.d=+el.dataset.d;render({center:true});}
  else if(a==='prev'||a==='next'){
    var mm=view.m+(a==='next'?1:-1),yy=view.y;
    if(mm<0){mm=11;yy--;}if(mm>11){mm=0;yy++;}
    view.y=yy;view.m=mm;var t=today();
    view.d=(yy===t.y&&mm===t.m)?t.d:Math.min(view.d,daysIn(yy,mm));
    render({center:true});
  }
  else if(a==='now'){var t2=today();view.y=t2.y;view.m=t2.m;view.d=t2.d;render({center:true});}
  else if(a==='dismiss'){state.starter=false;save();render();}
  else if(a==='up'||a==='down'){
    i=H.findIndex(function(x){return x.id===id;});var j=a==='up'?i-1:i+1;
    if(i>=0&&j>=0&&j<H.length){var tmp=H[i];H[i]=H[j];H[j]=tmp;save();render();}
  }
  else if(a==='del'){
    if(pendingDel===id){
      state.habits=H.filter(function(x){return x.id!==id;});
      Object.keys(state.checks).forEach(function(k){delete state.checks[k][id];});
      pendingDel=null;save();
    }else pendingDel=id;
    render();
  }
  else if(a==='setpc')setPasscode();
  else if(a==='logout')logout();
  else if(a==='copy'){
    var box=$('#expBox');box.select();var ok=false;
    try{ok=document.execCommand('copy');}catch(x){}
    if(!ok&&navigator.clipboard){navigator.clipboard.writeText(box.value).then(function(){flash.bk={k:'ok',t:'Backup copied.'};$('#bkMsg').className='msg ok';$('#bkMsg').textContent='Backup copied.';},function(){});}
    else{$('#bkMsg').className='msg '+(ok?'ok':'err');$('#bkMsg').textContent=ok?'Backup copied.':'Select the text above and copy it manually.';}
  }
  else if(a==='import')doImport();
  else if(a==='askwipe'){pendingDel='__all';render();}
  else if(a==='cancelwipe'){pendingDel=null;render();}
  else if(a==='wipe'){lsDel(PFX+prof.slug);lsDel(SESS);state=null;prof=null;pendingDel=null;flash={};showLogin();}
});
document.addEventListener('input',function(e){
  var el=e.target;
  if(el.id==='phoneIn'){el.value=el.value.replace(/\D/g,'').slice(0,10);if(el.value.length===10)el.blur();return;}
  if(el.id==='pc1'||el.id==='pc2'){el.value=el.value.replace(/\D/g,'').slice(0,4);return;}
  if(!state)return;
  if(el.dataset&&el.dataset.act==='rename'){
    var x=state.habits.find(function(h){return h.id===el.dataset.h;});
    if(x){x.name=el.value.slice(0,40);save();}
  }
});
document.addEventListener('change',function(e){
  var el=e.target;
  if(state&&el.dataset&&el.dataset.act==='rename'){
    var x=state.habits.find(function(h){return h.id===el.dataset.h;});

});
document.addEventListener('submit',function(e){

});

function setPasscode(){
  var a=$('#pc1').value,b=$('#pc2').value;
  function msg(k,t){flash.pc={k:k,t:t};var m=$('#pcMsg');m.className='msg '+k;m.textContent=t;}
  if(!/^\d{4}$/.test(a))return msg('err','The PIN must be exactly 4 digits.');
  if(a!==b)return msg('err','The two PINs do not match.');
  var sa=newSalt();
  hashPin(a,prof.slug,sa).then(function(hh){
    prof.salt=b64(sa);prof.hash=hh;return doSave();
  }).then(function(){flash.pc={k:'ok',t:'PIN changed.'};render();}).catch(function(){msg('err','Could not change the PIN in this browser.');});
}

}
function loginMsg(t,k){var m=$('#lockMsg');if(!m)return;m.textContent=t||'';m.style.color=(k==='muted')?'var(--muted)':(k==='ok'?'var(--accent)':'');}
function updDots(){var d=document.querySelectorAll('#dots i');for(var i=0;i<d.length;i++)d[i].className=i<L.pin.length?'f':'';}
function shake(){var d=$('#dots');if(!d)return;d.classList.remove('shake');void d.offsetWidth;d.classList.add('shake');}
function press(k){
  if($('#lock').hidden)return;
  if(k==='b')L.pin=L.pin.slice(0,-1);
  else if(L.pin.length<4)L.pin+=k;
  updDots();
  if(L.pin.length===4)setTimeout(submitPin,140);
}
function enter(pr,d){prof=pr;state=d;lsSet(SESS,pr.slug);$('#lock').hidden=true;$('#lock').innerHTML='';start();}
function resetEntry(){L.pin='';updDots();}
function submitPin(){
  var ph=$('#phoneIn');if(!ph)return;
  var phone=ph.value.replace(/\D/g,'');
  if(phone.length!==10){loginMsg('Enter your 10-digit mobile number first.');shake();resetEntry();ph.focus();return;}
  var pin=L.pin,now=Date.now();
  if(now<lockUntil){loginMsg('Too many wrong tries. Wait '+Math.ceil((lockUntil-now)/1000)+' seconds.');shake();resetEntry();return;}
  if(L.step==='confirm'){
    if(pin!==L.first){loginMsg('The PINs did not match. Please try again.');shake();backToEnter();return;}
    var sa=newSalt();
    hashPin(pin,phone,sa).then(function(hh){
      var pr={slug:phone,name:fmtPhone(phone),salt:b64(sa),hash:hh},d=defaultState();
      prof=pr;state=d;return doSave().then(function(){enter(pr,d);});
    }).catch(function(){loginMsg('Could not create your tracker in this browser.');});
    return;
  }
  var raw=lsGet(PFX+phone),rec=null;
  try{rec=raw?JSON.parse(raw):null;}catch(e){}
  if(rec&&rec.hash){
    loginMsg('Checking…','muted');
    hashPin(pin,phone,unb64(rec.salt)).then(function(hh){
      if(hh!==rec.hash){
        fails++;shake();resetEntry();
        if(fails>=5){fails=0;lockUntil=Date.now()+30000;loginMsg('Too many wrong tries. Wait 30 seconds.');}
        else loginMsg('Wrong number or PIN. Try again.');
        showForgot(phone);return;
      }
      fails=0;
      enter({slug:phone,name:rec.name||fmtPhone(phone),salt:rec.salt,hash:rec.hash},rec.data?normalize(rec.data):defaultState());
    }).catch(function(){loginMsg('Could not check the PIN in this browser.');});
  }else{
    /* new number: ask for the PIN twice so a typo cannot lock you out */
    L.first=pin;L.step='confirm';L.pin='';updDots();
    $('#phoneWrap').classList.add('ro');ph.readOnly=true;
    $('#pinLabel').textContent='Confirm your new PIN';
    loginMsg('New number '+fmtPhone(phone)+'. Enter the same PIN again to create your tracker.','muted');
    $('#forgot').innerHTML='<button class="linkbtn" id="chgNum" type="button">Wrong number? Change it</button>';
    $('#chgNum').addEventListener('click',function(){backToEnter();ph.focus();});
  }
}
function backToEnter(){
  L.step='enter';L.first='';L.pin='';updDots();
  var ph=$('#phoneIn');if(ph)ph.readOnly=false;
  var w=$('#phoneWrap');if(w)w.classList.remove('ro');
  $('#pinLabel').textContent='Enter your 4-digit PIN';$('#forgot').innerHTML='';
}
function showForgot(phone){
  $('#forgot').innerHTML='<button class="linkbtn" id="forgotBtn" type="button">Forgot PIN?</button>';
  $('#forgotBtn').addEventListener('click',function(){
    $('#forgot').innerHTML='<p style="color:var(--muted);font-size:13px;margin:6px 0 10px">PINs cannot be recovered. You can erase the tracker for '+esc(fmtPhone(phone))+' on this phone and start over (restore from a backup afterwards if you have one).</p><button class="btn danger" id="wipeLock" type="button" style="width:100%">Erase and start over</button>';
    $('#wipeLock').addEventListener('click',function(){lsDel(PFX+phone);if(lsGet(SESS)===phone)lsDel(SESS);fails=0;showLogin('Erased. Enter your number to start a fresh tracker.');});
  });
}
document.addEventListener('click',function(e){
  var k=e.target.closest&&e.target.closest('.key[data-k]');
  if(k&&!state)press(k.dataset.k);
});
document.addEventListener('keydown',function(e){
  if(state||$('#lock').hidden||e.metaKey||e.ctrlKey||e.altKey)return;
  var t=e.target;if(t&&t.id==='phoneIn'){if(e.key==='Enter'){t.blur();}return;}
  if(/^\d$/.test(e.key)){press(e.key);e.preventDefault();}
  else if(e.key==='Backspace'){press('b');e.preventDefault();}
});

/* ---------- import ---------- */
function doImport(){
  var box=$('#impBox'),msg=$('#bkMsg');
  try{
    var d=JSON.parse(box.value);
    if(!d||!Array.isArray(d.habits)||typeof d.checks!=='object')throw new Error('bad');
    var n=normalize(d);n.starter=false;state=n;save();
    flash.bk={k:'ok',t:'Restored '+n.habits.length+' habits.'};render();
  }catch(x){msg.className='msg err';msg.textContent='That does not look like a Habit Grid backup.';}
}

/* ---------- start ---------- */
function start(){
  var t=today();view.y=t.y;view.m=t.m;view.d=t.d;view.tab='today';
  $('#app').hidden=false;$('#tabbar').hidden=false;
  render({center:true});
}
function boot(){
  var sl=lsGet(SESS);
  if(sl){
    var raw=lsGet(PFX+sl),rec=null;
    try{rec=raw?JSON.parse(raw):null;}catch(e){}
    if(rec&&rec.hash){
      prof={slug:sl,name:rec.name||sl,salt:rec.salt,hash:rec.hash};
      state=rec.data?normalize(rec.data):defaultState();
      start();return;
    }
  }
  showLogin();
}
boot();
})();
</script>
